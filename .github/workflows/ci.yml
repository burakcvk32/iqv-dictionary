name: IQV Dictionary CI

# IQV Dictionary CI -- tek workflow icinde backend + dashboard + destek
# kontrolleri (k6 performans, Docker build dogrulama, install/update
# script syntax denetimi). MkDocs/dokumantasyon build'i BURADA DEGIL,
# ayri "IQV Dictionary Docs" workflow'unda (.github/workflows/docs.yml)
# calisir -- ikisi ayni koddaki degisiklige gore GEREKSIZ YERE birbirini
# tetiklemesin diye ayrildi (bkz. docs.yml'deki `paths` filtresi).
#
# Dependabot PR'lari (`build(deps)...` / `build(deps-dev)...` baslikli)
# AYRI bir workflow/dosya OLUSTURMAZ -- her Dependabot PR'i, normal bir
# pull_request gibi bu AYNI "IQV Dictionary CI" workflow'unu tetikler.
# Actions ekranindaki cok sayida "build(deps)..." satiri, GitHub'in HER
# PR/push icin bu TEK workflow'u ayri bir "run" olarak listelemesinden
# kaynaklanir -- bu normal/beklenen davranistir, workflow SAYISINI
# artirmaz (bkz. dependabot.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_k6_load_test:
        description: 'k6 LOAD/STRESS testlerini de calistir (uzun surer, varsayilan: hayir)'
        type: boolean
        default: false

# KOK NEDEN: backend hicbir zaman uretim/staging'e bu pipeline'dan
# deploy EDILMIYOR (kullanicinin acik "production deploy YOK" kurali) --
# CI yalnizca dogrulama yapar, hicbir yere yayin yapmaz.
env:
  NODE_VERSION: '20.x'

jobs:
  # ============================================================
  # FRONTEND (dashboard/) -- cheap checks once, expensive (build) last.
  # Gercek paket yoneticisi pnpm'dir (dashboard/pnpm-lock.yaml
  # kaynak-dogrusu, dashboard/README.md zaten pnpm ile yazili) --
  # deterministic install icin `pnpm install --frozen-lockfile`.
  # ============================================================
  frontend:
    name: Frontend (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies (deterministic)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run prettier

      - name: Unit / component tests
        run: pnpm run test
        env:
          NODE_ENV: test

      - name: Coverage
        run: pnpm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-coverage
          path: dashboard/coverage
          retention-days: 14

      - name: Build (production bundle)
        run: pnpm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  # ============================================================
  # BACKEND (backend/) -- gercek paket yoneticisi npm
  # (backend/package-lock.json kaynak-dogrusu) -- deterministic install
  # icin `npm ci`.
  # ============================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run prettier

      # CI, GERCEK/uretim MongoDB'sine ASLA baglanmaz. Backend'in KENDI
      # test paketi zaten kurulu standarda uyuyor: `src/tests/support/*`
      # altindaki in-memory sahte repository'ler (Mongo YERINE gecen).
      - name: Unit / integration tests (in-memory repositories, no real Mongo)
        run: npm test
        env:
          NODE_ENV: test

      - name: Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      - name: Build
        run: npm run build

      # Yalnizca GERCEKTEN var olan `/health` ucu test edilir (bkz.
      # src/app.ts). Sunucu, gercek Mongo'ya ihtiyac duymayan in-memory
      # k6 test sunucusuyla (bkz. tests/performance/server/k6TestServer.ts)
      # gecici olarak ayaga kaldirilir.
      - name: Smoke-start server and check /health
        run: |
          nohup env K6_TEST_SERVER_PORT=4001 npx tsx tests/performance/server/k6TestServer.ts > /tmp/health_server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4001/health > /dev/null; then
              echo "backend /health OK"
              exit 0
            fi
            sleep 1
          done
          echo "backend /health did not respond in time"
          cat /tmp/health_server.log
          exit 1

  # ============================================================
  # k6 SMOKE -- kisa, dusuk VU, her push/PR'da calisir. Uretime ASLA
  # karsi calismaz -- yalnizca in-memory k6TestServer'a karsi.
  # ============================================================
  k6-smoke:
    name: k6 performance smoke
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start in-memory test server
        run: |
          nohup env K6_TEST_SERVER_PORT=4001 npx tsx tests/performance/server/k6TestServer.ts > /tmp/k6_server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4001/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/k6_server.log
          exit 1

      - name: Run k6 smoke scripts
        run: |
          k6 run tests/performance/k6/auth-smoke.js
          k6 run tests/performance/k6/dictionary-read.js
          k6 run tests/performance/k6/dictionary-crud.js
          k6 run tests/performance/k6/personnel-read.js
        env:
          K6_TEST_SERVER_PORT: 4001

  # ============================================================
  # k6 LOAD/STRESS -- manuel/nightly, PR/push'ta calismaz. Yalnizca
  # `workflow_dispatch` ile `run_k6_load_test=true` verildiginde calisir.
  # ============================================================
  k6-load-stress:
    name: k6 load/stress (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_k6_load_test == true
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start in-memory test server
        run: |
          nohup env K6_TEST_SERVER_PORT=4001 npx tsx tests/performance/server/k6TestServer.ts > /tmp/k6_server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4001/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/k6_server.log
          exit 1

      - name: Run k6 load test (dictionary-read + auth)
        run: |
          k6 run tests/performance/k6/dictionary-read.js
          k6 run tests/performance/k6/auth-smoke.js
        env:
          K6_TEST_SERVER_PORT: 4001

  # ============================================================
  # DOCKER -- yalnizca YEREL DOGRULAMA -- hicbir registry'ye PUSH
  # edilmez, hicbir yere deploy edilmez.
  # ============================================================
  docker-build:
    name: Docker build validation
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # KOK NEDEN: docker-compose.yml'deki dictionary-backend servisi
      # `env_file: ./backend/.env` kullanir -- bu dosya repo'da YOKTUR
      # (bilerek .gitignore'da, gercek sirlar asla commit edilmez), bu
      # yuzden `docker compose ... config` (syntax/interpolation
      # dogrulamasi, gercek bir container BASLATMAZ) bu dosyayi bulamayinca
      # FAIL olur. Cozum: runner'in GECICI dosya sisteminde, SADECE bu
      # job suresince var olan, backend/.env.example'daki (zaten CI-safe
      # placeholder degerler icin repo'da mevcut) degerlerden bir
      # backend/.env kopyasi olusturulur -- hicbir gercek sir eklenmez,
      # hicbir yere commit edilmez, hicbir artifact'e dahil edilmez
      # (backend/.dockerignore zaten .env'i build context'inden haric
      # tutar). Runner is bitince bu dosya kalici olarak yok olur.
      - name: Create CI-only backend/.env for Docker Compose validation (ephemeral runner file, safe placeholders only, never committed)
        run: cp backend/.env.example backend/.env

      - name: Build backend image (dev — local validation only, no push)
        run: docker build -t iqv-dictionary-backend:ci ./backend

      - name: Build dashboard image (dev — local validation only, no push)
        run: docker build -t iqv-dictionary-frontend:ci ./dashboard

      - name: Validate docker-compose.yml (dev)
        run: docker compose -f docker-compose.yml config

      # ------------------------------------------------------------
      # PRODUCTION images/compose — see scripts/windows/install.ps1 and
      # scripts/linux/install.sh (`-Mode docker`) and
      # docs/deployment/installation.md. Same "local validation only, no
      # push, no deploy" rule as the dev images above.
      # ------------------------------------------------------------
      - name: Build backend PRODUCTION image (local validation only, no push)
        run: docker build -f backend/Dockerfile.prod -t iqv-dictionary-backend:prod-ci ./backend

      - name: Build dashboard PRODUCTION image (local validation only, no push)
        run: |
          docker build -f dashboard/Dockerfile.prod \
            --build-arg VITE_API_BASE_URL=http://localhost:3001 \
            -t iqv-dictionary-frontend:prod-ci ./dashboard

      - name: Validate docker-compose.prod.yml
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml --env-file .env config

  scripts-lint:
    name: Install/Update/Uninstall script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bash syntax check (scripts/linux)
        run: |
          set -e
          for f in scripts/linux/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: PowerShell syntax check (scripts/windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path scripts/windows -Include *.ps1,*.psm1 -Recurse
          $hadError = $false
          foreach ($f in $files) {
            Write-Host "Checking $($f.FullName)"
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $hadError = $true
              foreach ($e in $parseErrors) { Write-Error $e }
            }
          }
          if ($hadError) { throw "PowerShell syntax errors found." }

  # ============================================================
  # QUALITY PIPELINE -- Backend/Frontend/Docker/k6-smoke/scripts-lint
  # job'larinin GERCEK sonuclarini (`needs.*.result`) toplayip 100
  # puanlik bir kalite raporu uretir (REPORT.md/REPORT.json/QUALITY.svg)
  # ve GitHub Step Summary'ye yazar. `if: always()` ile CI'nin ONCEKI
  # asamalarindan biri FAIL olsa/skip edilse BILE calisir -- boylece
  # Backend/Frontend fail oldugunda "sonraki job'lar skip olup quality
  # artifact hic olusmuyor" sorunu ORTADAN KALKAR. Strict Gate ACIK /
  # Soft Gate KAPALI: skor yalnizca RAPORLAMA icindir, gercek bir
  # zorunlu asama basarisiz/iptal/beklenmedik-skip ise sonuc HER ZAMAN
  # FAILED'dir (bkz. scripts/ci/generate-quality-report.mjs).
  #
  # SIRALAMA (kasitli, degistirilmemeli): once rapor + artifact,
  # EN SONUNDA gerekirse strict gate nedeniyle job'u FAIL et -- boylece
  # gercek bir CI basarisizliginda bile REPORT.md/REPORT.json/QUALITY.svg
  # artifact'i HER ZAMAN uretilir ve indirilebilir kalir.
  # ============================================================
  quality-pipeline:
    name: Quality Pipeline
    if: always()
    needs:
      - frontend
      - backend
      - docker-build
      - k6-smoke
      - k6-load-stress
      - scripts-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: always()
        uses: actions/checkout@v4

      - name: Set up Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Quality Report (REPORT.md / REPORT.json / QUALITY.svg)
        if: always()
        env:
          QR_BACKEND_RESULT: ${{ needs.backend.result }}
          QR_FRONTEND_RESULT: ${{ needs.frontend.result }}
          QR_DOCKER_RESULT: ${{ needs.docker-build.result }}
          QR_K6_SMOKE_RESULT: ${{ needs.k6-smoke.result }}
          QR_SCRIPTS_LINT_RESULT: ${{ needs.scripts-lint.result }}
          QR_K6_LOAD_STRESS_RESULT: ${{ needs.k6-load-stress.result }}
          QR_EVENT_NAME: ${{ github.event_name }}
          QR_SHA: ${{ github.sha }}
          QR_REF_NAME: ${{ github.ref_name }}
          QR_RUN_ID: ${{ github.run_id }}
          QR_SERVER_URL: ${{ github.server_url }}
          QR_REPOSITORY: ${{ github.repository }}
          QR_NODE_VERSION: ${{ env.NODE_VERSION }}
          QR_OUTPUT_DIR: quality-report
        run: node scripts/ci/generate-quality-report.mjs

      - name: Upload Quality Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iqv-dictionary-quality-report
          path: quality-report
          retention-days: 30
          if-no-files-found: error

      - name: Enforce strict quality gate
        if: always()
        run: |
          if [ -f quality-report/GATE_RESULT.txt ]; then
            RESULT=$(cat quality-report/GATE_RESULT.txt)
          else
            RESULT="FAILED"
            echo "::warning::quality-report/GATE_RESULT.txt bulunamadi -- guvenli varsayilan olarak FAILED kabul ediliyor."
          fi
          echo "Quality Gate Result: $RESULT"
          if [ "$RESULT" != "PASSED" ]; then
            echo "::error::IQV Dictionary Quality Gate FAILED (Strict Gate Mode: ACIK). Ayrintilar icin 'iqv-dictionary-quality-report' artifact'indeki REPORT.md dosyasina bakin."
            exit 1
          fi
