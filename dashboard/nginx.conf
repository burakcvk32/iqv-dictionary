# IQV Dictionary dashboard — production static file server config.
# Only used by dashboard/Dockerfile.prod (docker-compose.prod.yml).
#
# SPA fallback: unknown paths resolve to index.html so React Router
# (dashboard/src/routes) keeps handling client-side routing — no routing
# logic is duplicated or changed here.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite's default output filenames include a
    # content hash) — safe to cache for a long time.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
